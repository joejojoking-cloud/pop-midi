<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>华语流行歌 MIDI 曲库 · 909 首可试听可下载</title>
<meta name="description" content="909 首华语流行歌 MIDI，浏览器内直接试听，单曲或整包下载。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head-top">
    <h1>华语流行歌 MIDI 曲库</h1>
    <span class="count" id="count">载入中…</span>
  </div>
  <div class="search-row">
    <input id="q" type="search" placeholder="搜索歌名或歌手，例如 说散就散 / 周杰伦 / 成都" autocomplete="off" spellcheck="false">
  </div>
  <div class="quick">
    <button id="randomBtn" class="quick-btn">🎲 随机听一首</button>
    <button id="favBtn" class="quick-btn">★ 我的收藏</button>
    <a class="quick-btn" href="https://connect-ai.feishu.cn/share/base/shrcnXHJ1qjIXHEcQua9Q71SNoh" target="_blank" rel="noopener">许愿 / 报错</a>
    <button id="shareBtn" class="quick-btn">分享本站</button>
  </div>
  <div class="filters">
    <select id="region">
      <option value="">全部地区</option>
      <option value="大陆">大陆</option>
      <option value="香港">香港</option>
      <option value="台湾">台湾</option>
      <option value="新加坡">新加坡</option>
      <option value="马来西亚">马来西亚</option>
      <option value="其他">其他</option>
    </select>
    <select id="artist"><option value="">全部歌手</option></select>
    <select id="sort" aria-label="排序">
      <option value="dl">按时长降序</option>
      <option value="t">按歌名</option>
      <option value="a">按歌手</option>
      <option value="d">按时长升序</option>
    </select>
  </div>
</header>

<main>
  <div class="bundle">
    <span>懒得一首首下？</span>
    <a href="downloads/pop909-midi.zip" download>打包下载全部 909 首（约 13 MB zip）</a>
  </div>
  <div id="notice" class="notice" hidden></div>
  <ul id="list"></ul>
  <div id="empty" class="empty" hidden>没有匹配的曲子，换个关键词试试。</div>
  <div id="sentinel" class="sentinel"></div>
</main>

<div id="player" class="player" hidden>
  <button id="playBtn" class="ctrl" aria-label="播放/暂停">▶</button>
  <div class="meta">
    <div class="now" id="nowTitle">—</div>
    <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度">
  </div>
  <span class="time" id="time">0:00</span>
  <input id="vol" class="vol" type="range" min="0" max="100" value="85" aria-label="音量">
  <a id="dlNow" class="dl" download>下载</a>
  <button id="closeBtn" class="ctrl ghost" aria-label="停止">✕</button>
</div>

<footer>
  <p>MIDI 来自 <a href="https://github.com/music-x-lab/POP909-Dataset" target="_blank" rel="noopener">POP909 数据集</a>（909 首华语流行歌，主旋律 + 伴奏 + 和弦标注，学术开源）。</p>
  <p>浏览器内用 SoundFont 实时合成，手机上建议戴耳机。若下载按钮没反应，点右上角「···」→「在浏览器打开」。</p>
</footer>

<script src="app.js?v=2"></script>
</body>
</html>
